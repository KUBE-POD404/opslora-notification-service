name: Reusable SonarCloud Scan

on:
  workflow_call:
    outputs:
      quality_gate_status:
        description: "SonarCloud Quality Gate Status"
        value: ${{ jobs.sonar.outputs.quality_gate_status }}
      notify_summary:
        description: "Notification summary"
        value: ${{ jobs.sonar.outputs.notify_summary }}

jobs:
  sonar:
    runs-on: ubuntu-latest

    outputs:
      quality_gate_status: ${{ steps.set_outputs.outputs.quality_gate_status }}
      notify_summary: ${{ steps.set_outputs.outputs.notify_summary }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require SonarCloud token
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "SONAR_TOKEN repository secret is required for SonarCloud."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Generate coverage report
        run: python -m pytest --cov=app --cov-report=xml

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonarcloud
          restore-keys: ${{ runner.os }}-sonarcloud

      - name: SonarCloud scan and quality gate
        id: sonar
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || 'kube-pod404' }}
            -Dsonar.projectKey=KUBE-POD404_opslora-notification-service
            -Dsonar.branch.name=${{ github.head_ref || github.ref_name }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          GITHUB_EVENT_NAME: push
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

      - name: Set outputs
        id: set_outputs
        if: always()
        run: |
          if [ "${{ steps.sonar.outcome }}" = "failure" ]; then
            echo "quality_gate_status=FAILED" >> "$GITHUB_OUTPUT"
            echo "notify_summary=SonarCloud scan or quality gate failed" >> "$GITHUB_OUTPUT"
          else
            echo "quality_gate_status=PASSED" >> "$GITHUB_OUTPUT"
            echo "notify_summary=SonarCloud quality gate passed" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarCloud scanner did not complete
        if: ${{ steps.sonar.outcome == 'failure' }}
        run: |
          echo "SonarCloud scan did not complete; check notify_summary output for details."
